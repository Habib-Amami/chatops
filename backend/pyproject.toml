[project]
name = "chatops-backend"
version = "0.1.0"
description = "FastAPI backend for ChatOps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "awscli>=1.45.46",
    "awscli-local>=0.22.2",
    "boto3>=1.43.42",
    "fastapi[standard]>=0.116.0",
    "kubernetes>=36.0.2",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.8",
    "langsmith>=0.9.8",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
